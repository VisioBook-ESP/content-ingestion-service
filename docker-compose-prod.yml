
services:
  content-ingestion-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
    image: content-ingestion-service:prod
    container_name: content-ingestion-service
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://test_user:test_password@postgres:5432/test_db
    ports:
      - "8082:8080"
    entrypoint: ["sh", "docker/entrypoint.sh"]
    volumes:
      - ./:/app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Base de données pour les tests
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d test_db"]
      interval: 10s
      timeout: 5s
      retries: 5
