
name: CI Dev

on:
  pull_request:
    branches: ["dev"]
  push:
    branches: ["**"]

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.11"
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/visiobook-esp/content-ingestion-service-dev
  DOCKERFILE_PROD: docker/Dockerfile.prod

jobs:
  black-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install black
      - name: Black formatting check
        run: black --check src tests


  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff import order & style check
        run: ruff check src tests


  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-requests types-PyYAML types-python-dateutil
      - name: Mypy type check
        run: mypy --explicit-package-bases src tests

  no-debug-leftovers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if Python debug statements exist outside tests/
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E '(pdb\.set_trace\(|(^|[^[:alnum:]_])print\(|breakpoint\()' -- \
              '*.py' ':(exclude)tests/**' ':(exclude).venv/**' ':(exclude)venv/**'; then
            echo "::error:: Python debug statements found outside tests/." >&2
            exit 1
          fi
          echo "----- No debug leftovers outside tests/"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio httpx
          pip install -r requirements.txt
      - name: Create test environment
        run: |
          cat > .env << 'EOF'
          PYTHONPATH=/app
          PYTHONUNBUFFERED=1
          APP_ENV=test
          EOF
          sed -i 's/^[[:space:]]*//' .env
      - name: docker compose
        run: docker compose -f docker-compose-prod.yml up --build -d

      - name: Wait for services to be ready
        run: |
          docker ps
          echo "Trying health endpoint..."
          curl -v http://localhost:8080/health || true

      - name: Run unit tests
        run: docker exec content-ingestion-service pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=0


  docker-build-and-push:
    runs-on: ubuntu-latest
    needs:
      - black-check
      - ruff-check
      - type-check
      - no-debug-leftovers
      - unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}
      - name: Build and push prod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE_PROD }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
