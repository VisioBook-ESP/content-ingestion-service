
name: CI Dev

on:
  pull_request:
    branches: ["dev"]

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.11"
  IMAGE_REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/visiobook-esp/content-ingestion-service-dev
  DOCKERFILE_PROD: docker/Dockerfile.prod

jobs:
  black-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install black
      - name: Black formatting check
        run: black --check src tests


  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Ruff import order & style check
        run: ruff check src tests


  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-requests types-PyYAML types-python-dateutil
      - name: Mypy type check
        run: mypy --explicit-package-bases src tests

  no-debug-leftovers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail if Python debug statements exist outside tests/
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nI -E '(pdb\.set_trace\(|(^|[^[:alnum:]_])print\(|breakpoint\()' -- \
              '*.py' ':(exclude)tests/**' ':(exclude)scripts/**' ':(exclude).venv/**' ':(exclude)venv/**'; then
            echo "::error:: Python debug statements found outside tests/." >&2
            exit 1
          fi
          echo "----- No debug leftovers outside tests/"

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=0

